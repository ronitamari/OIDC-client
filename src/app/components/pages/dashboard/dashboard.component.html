<app-tool-bar></app-tool-bar>
<div class="all-page">
  <mat-card appearance="outlined" class="main-card">
    <div class="dashboard-container">
      <div class="sidebar-content title-container">
        <img [src]="user.photo" alt="Profile" class="avatar" />
        <h2 class="name title">{{ user.displayName }}</h2>
      </div>

      <section class="section">
        <h3 class="section-title title">About:</h3>
        <div class="info-grid">
          <div><strong>Full Name:</strong> {{ user.displayName }}</div>
          <div><strong>Email:</strong> {{ user.email }}</div>
        </div>
      </section>
    </div>
    <img [src]="pictureUrl" alt="success img" width="100" height="100" />
  </mat-card>
</div>
